<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rush Event Pilot — Timeline</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="app/styles/main.css">
</head>
<body>

<!-- ═══════════════════════════════════════════════════════════════
     BARRE SUPÉRIEURE (topbar)
     Logo + bouton projets + nom du projet + durée totale + sauvegarder
     ═══════════════════════════════════════════════════════════════ -->
<div class="topbar">
  <span class="topbar-logo">REP</span>
  <button class="btn btn-ghost btn-sm" id="openProjectsBtn">📁 Projets</button>
  <input class="project-name-input" id="projectName" placeholder="Nom du projet..." value="Sans titre">
  <div class="topbar-right">
    <div class="total-duration-wrap">
      <span class="total-duration-label">Durée totale</span>
      <input class="total-duration-input" id="totalDurationInput" type="number" value="90" min="1" max="600">
      <span class="total-duration-unit">min</span>
    </div>
    <button class="btn btn-primary btn-sm" id="saveBtn">💾 Créer projet</button>
  </div>
</div>

<!-- ═══════════════════════════════════════════════════════════════
     ESPACE DE TRAVAIL (workspace)
     Une seule colonne verticale avec 3 zones empilées :
       1. Preview    (en haut)    — infos du bloc sélectionné
       2. Timeline   (au centre)  — blocs proportionnels + curseur
       3. Formulaire (en bas)     — ajout de nouveaux blocs
     ═══════════════════════════════════════════════════════════════ -->
<div class="workspace">

  <!-- ── ZONE 1 : PREVIEW (en haut) ───────────────────────────────
       Affiche les infos du bloc sélectionné.
       Zone vide si aucun bloc n'est sélectionné. -->
  <section class="preview-area" id="previewArea">
    <!-- État vide : aucun bloc sélectionné -->
    <div class="preview-empty" id="previewEmpty">
      <span class="preview-empty-icon">🎬</span>
      <div>
        <strong>Sélectionnez un plan</strong>
        <p>Touchez un bloc dans la timeline pour afficher ses détails.</p>
      </div>
    </div>
    <!-- En-tête du détail (masqué tant que rien n'est sélectionné) -->
    <div class="detail-header" id="detailHeader" hidden>
      <span class="detail-type-badge" id="detailBadge">—</span>
      <button class="detail-close" id="detailClose">✕</button>
    </div>
    <!-- Corps du détail — rempli dynamiquement par le JS -->
    <div class="detail-body" id="detailBody"></div>
  </section>

  <!-- ── ZONE 2 : TIMELINE (au centre) ───────────────────────────
       Affiche les blocs proportionnellement à leur durée.
       Scroll horizontal, zoom, curseur de navigation. -->
  <section class="timeline-area">
    <!-- Conteneur scrollable (règle + piste + curseur défilent ensemble) -->
    <div class="timeline-scroll" id="timelineScroll">
      <div class="timeline-inner" id="timelineInner">
        <!-- Règle graduée (canvas) -->
        <div class="ruler">
          <canvas id="rulerCanvas"></canvas>
        </div>
        <!-- Piste contenant les blocs + le curseur -->
        <div class="timeline-track" id="timelineTrack">
          <!-- État vide -->
          <div class="timeline-empty" id="emptyState">
            <span>Aucun plan — ajoutez-en un ci-dessous</span>
            <button class="btn btn-primary btn-sm" id="emptyAddBlockBtn">+ Premier plan</button>
          </div>
          <!-- Curseur de navigation (playhead) -->
          <div class="timeline-cursor" id="timelineCursor">
            <div class="cursor-handle"></div>
            <div class="cursor-time" id="cursorTime">0 min</div>
          </div>
        </div>
      </div>
    </div>
    <!-- Barre de contrôles timeline -->
    <div class="timeline-controls">
      <button class="btn btn-ghost btn-sm" id="importMdBtn">📄 Import MD</button>
      <input type="file" id="mdFileInput" accept=".md,.txt" hidden>
      <div class="zoom-controls">
        <button id="zoomOut">−</button>
        <span id="zoomLabel">100%</span>
        <button id="zoomIn">+</button>
      </div>
      <div class="timeline-stats">
        Plans: <span id="blockCount">0</span> · Pourvus: <span id="coverageCount">0</span> · Planifié: <span id="plannedTotal">0 min</span> · Total: <span id="totalDisplay">90 min</span>
      </div>
    </div>
  </section>

  <!-- ── ZONE 3 : FORMULAIRE D'AJOUT (en bas) ─────────────────────
       Formulaire compact pour ajouter un nouveau plan. -->
  <section class="add-block-area">
    <div class="add-block-title">Ajouter un plan</div>
    <!-- Sélecteur de type (boutons) -->
    <div class="type-select" id="typeSelect">
      <button class="type-opt sel" data-type="ouverture" style="--tc:#4DA6FF">Ouverture</button>
      <button class="type-opt" data-type="interview" style="--tc:#FF5E3A">Interview</button>
      <button class="type-opt" data-type="broll" style="--tc:#A8FF47">B-Roll</button>
      <button class="type-opt" data-type="transition" style="--tc:#C47FFF">Transition</button>
      <button class="type-opt" data-type="cloture" style="--tc:#FFB830">Clôture</button>
    </div>
    <!-- Champs du formulaire -->
    <div class="add-block-form">
      <input class="form-input" id="newBlockName" type="text" placeholder="Intitulé du plan">
      <input class="form-input" id="newBlockDur" type="number" value="5" min="1" placeholder="Durée (min)">
      <textarea class="form-input" id="newBlockDesc" placeholder="Description attendue..."></textarea>
      <button class="btn btn-primary" id="addBlockBtn">+ Ajouter</button>
    </div>
  </section>
</div>

<!-- ═══════════════════════════════════════════════════════════════
     NOTIFICATION (toast) — message temporaire en bas d'écran
     ═══════════════════════════════════════════════════════════════ -->
<div class="toast" id="toast"></div>

<!-- ═══════════════════════════════════════════════════════════════
     MODALE DE CONNEXION
     ═══════════════════════════════════════════════════════════════ -->
<div class="modal-overlay" id="loginModal">
  <div class="modal-box">
    <div class="modal-title">Connexion réalisateur</div>
    <form id="loginForm">
      <div class="form-field">
        <label class="form-label">Utilisateur</label>
        <input class="form-input" id="loginUser" type="text" autocomplete="username" placeholder="nom d'utilisateur">
      </div>
      <div class="form-field">
        <label class="form-label">Mot de passe</label>
        <input class="form-input" id="loginPass" type="password" autocomplete="current-password" placeholder="••••••••">
      </div>
      <div id="loginError" class="login-error"></div>
      <button class="btn btn-primary" type="submit">Se connecter</button>
      <button class="btn btn-ghost" type="button" id="guestBtn">Continuer sans compte</button>
    </form>
  </div>
</div>

<!-- ═══════════════════════════════════════════════════════════════
     MODALE DES PROJETS
     ═══════════════════════════════════════════════════════════════ -->
<div class="modal-overlay" id="projectModal">
  <div class="modal-box">
    <div class="modal-header">
      <div class="modal-title">Projets</div>
      <button class="modal-close" id="projectModalClose">✕</button>
    </div>
    <div id="projectList"></div>
    <div class="new-project-section">
      <div class="form-field">
        <label class="form-label">Nouveau projet</label>
        <input class="form-input" id="newProjectLabel" placeholder="Nom du projet...">
      </div>
      <button class="btn btn-primary btn-sm" id="createProjectBtn">Créer</button>
    </div>
    <button class="btn btn-ghost btn-sm" id="modalLogoutBtn">Se déconnecter</button>
  </div>
</div>

<!-- Script principal (chargé en fin de body → tous les éléments DOM existent) -->
<script src="app/views/script_editor.js"></script>
</body>
</html>
